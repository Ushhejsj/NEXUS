<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <title>NEXUS</title>
    <style>
      html, body, #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101114;
      }
      #startup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 45%, #211a35 0%, #101114 65%);
        color: #eeeaf8;
        font-family: "Segoe UI", sans-serif;
      }
      .startup-logo {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 9px;
        padding-left: 9px;
      }
      .startup-status {
        color: #888397;
        font-size: 10px;
        letter-spacing: 3px;
      }
      .startup-loader {
        width: 100px;
        height: 2px;
        overflow: hidden;
        background: #292432;
        border-radius: 5px;
      }
      .startup-loader::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #a78bfa;
        animation: startup-progress 1.2s ease-in-out infinite;
      }
      @keyframes startup-progress {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup">
        <div class="startup-logo">NEXUS</div>
        <div class="startup-status">INITIALIZING SYSTEM</div>
        <div class="startup-loader"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
